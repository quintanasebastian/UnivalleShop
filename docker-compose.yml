
services:

  users-mongodb:
    image: mongo:8.0
    container_name: users-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - users-mongodb-data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  users-service:
    build:
      context: ./services/users-service
      dockerfile: Dockerfile

    container_name: users-service
    restart: unless-stopped

    # Sin puerto publicado: solo se accede a través del api-gateway.
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://users-mongodb:27017/univalle_shop_users
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-univalleshop-dev-internal-token}

    depends_on:
      users-mongodb:
        condition: service_healthy

  catalog-mongodb:
    image: mongo:8.0
    container_name: catalog-mongodb
    restart: unless-stopped

    ports:
      - "27018:27017"

    volumes:
      - catalog-mongodb-data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile

    container_name: catalog-service
    restart: unless-stopped

    # Sin puerto publicado: solo se accede a través del api-gateway.
    environment:
      PORT: 3002
      MONGODB_URI: mongodb://catalog-mongodb:27017/univalle_shop_catalog
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-univalleshop-dev-internal-token}

    depends_on:
      catalog-mongodb:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3002/products', { headers: { 'x-internal-token': process.env.INTERNAL_TOKEN } }).then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  orders-mongodb:
    image: mongo:8.0
    container_name: orders-mongodb
    restart: unless-stopped

    ports:
      - "27019:27017"

    volumes:
      - orders-mongodb-data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  orders-service:
    build:
      context: ./services/orders-service
      dockerfile: Dockerfile

    container_name: orders-service
    restart: unless-stopped

    # Sin puerto publicado: solo se accede a través del api-gateway.
    environment:
      PORT: 3003
      MONGODB_URI: mongodb://orders-mongodb:27017/univalle_shop_orders
      CATALOG_SERVICE_URL: http://catalog-service:3002
      CATALOG_REQUEST_TIMEOUT_MS: 5000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-univalleshop-dev-internal-token}

    depends_on:
      orders-mongodb:
        condition: service_healthy
      catalog-service:
        condition: service_healthy

  # Punto de entrada único: enruta /api/* y centraliza la seguridad.
  # Es el único contenedor de la aplicación con puerto publicado.
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile

    container_name: api-gateway
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      PORT: 8080
      USERS_SERVICE_URL: http://users-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      ORDERS_SERVICE_URL: http://orders-service:3003
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-univalleshop-dev-internal-token}
      # Correos de los administradores de la tienda, separados por comas.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}

    depends_on:
      users-service:
        condition: service_started
      catalog-service:
        condition: service_healthy
      orders-service:
        condition: service_started

volumes:
  users-mongodb-data:
  catalog-mongodb-data:
  orders-mongodb-data:
