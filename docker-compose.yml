
services:

  users-mongodb:
    image: mongo:8.0
    container_name: users-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - users-mongodb-data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  users-service:
    build:
      context: ./services/users-service
      dockerfile: Dockerfile

    container_name: users-service
    restart: unless-stopped

    ports:
      - "3001:3001"

    environment:
      PORT: 3001
      MONGODB_URI: mongodb://users-mongodb:27017/univalle_shop_users

    depends_on:
      users-mongodb:
        condition: service_healthy

  catalog-mongodb:
    image: mongo:8.0
    container_name: catalog-mongodb
    restart: unless-stopped

    ports:
      - "27018:27017"

    volumes:
      - catalog-mongodb-data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile

    container_name: catalog-service
    restart: unless-stopped

    ports:
      - "3002:3002"

    environment:
      PORT: 3002
      MONGODB_URI: mongodb://catalog-mongodb:27017/univalle_shop_catalog

    depends_on:
      catalog-mongodb:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3002/products').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  orders-mongodb:
    image: mongo:8.0
    container_name: orders-mongodb
    restart: unless-stopped

    ports:
      - "27019:27017"

    volumes:
      - orders-mongodb-data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  orders-service:
    build:
      context: ./services/orders-service
      dockerfile: Dockerfile

    container_name: orders-service
    restart: unless-stopped

    ports:
      - "3003:3003"

    environment:
      PORT: 3003
      MONGODB_URI: mongodb://orders-mongodb:27017/univalle_shop_orders
      CATALOG_SERVICE_URL: http://catalog-service:3002
      CATALOG_REQUEST_TIMEOUT_MS: 5000

    depends_on:
      orders-mongodb:
        condition: service_healthy
      catalog-service:
        condition: service_healthy

volumes:
  users-mongodb-data:
  catalog-mongodb-data:
  orders-mongodb-data:
